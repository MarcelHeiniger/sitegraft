name: CI

# GitHub-hosted runners only (ubuntu-latest). This repo is PUBLIC — a
# self-hosted runner here would execute arbitrary code from fork PRs on
# Marcel's own compute. Actions is free/unlimited on public repos, so
# there's no reason to trade that safety away.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Read-only by default; no job needs to write anything back to the repo.
permissions:
  contents: read

# On a PR, github.ref is refs/pull/N/merge -- unique per PR, so cancelling
# an in-flight run when a newer push supersedes it is safe and desirable
# (stops two full job sets racing and the checks list flapping). On a push
# to main, github.ref is refs/heads/main -- THE SAME for every merge, so
# unconditional cancel-in-progress would cancel a previous merge commit's
# still-running CI (conclusion: cancelled, not failure) the moment a next
# merge lands close behind it, silently losing that commit's CI signal.
# Two merges 10s apart did exactly this on 2026-08-15. Only cancel on PR
# runs; every push-to-main run gets to finish and report for itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: Shell lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout v5, pinned by commit SHA (the only third-party
      # action this workflow uses).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        # Config lives in .shellcheckrc at repo root (auto-discovered): it
        # disables 3 codes repo-wide (SC1091, SC2012, SC2016) that are wide,
        # structural false positives for this codebase (dynamically-sourced
        # module paths, sitegraft's own timestamp-named dirs, PHP source
        # deliberately single-quoted for wp-cli/eval). Everything else stays
        # at shellcheck's default severity — narrower false positives are
        # disabled inline/per-file at their exact site instead (see
        # .shellcheckrc's own header for why).
        run: |
          shellcheck bin/sitegraft
          shellcheck lib/*.sh
          shellcheck modules/*.sh modules/*.sh.example
          shellcheck tests/integration/*.sh tests/integration/fixtures/*.sh
          shellcheck tests/lint/*.sh

  unit-tests:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install bats and sitegraft's runtime dependencies
        # The unit suite exercises bin/sitegraft's real require_cmd checks
        # (jq, rsync, gzip, shasum, ssh), so those need to be present too —
        # installed explicitly rather than relying on the runner image
        # happening to already have them. gzip is always in base Ubuntu;
        # shasum ships in the `perl` package; ssh is `openssh-client`.
        #
        # php-cli and php-xml (issue #106): a slice of this suite — the
        # "captured PHP execution-proof" tests, which run the tool's own
        # real PHP (lib/php/*.php) rather than a copy of its logic, which
        # is exactly what gives those tests their value — needs a working
        # `php` on PATH with the xml/dom extension. They were passing only
        # because ubuntu-latest happens to ship both already. Measured
        # directly, twice for stability, against a bare `ubuntu:24.04`
        # container running ONLY the packages this job installed before
        # this fix (bats jq rsync perl openssh-client curl): 43 tests fail
        # every time, across test_bin_sitegraft.bats, test_etch_module.bats,
        # test_graft_options.bats, test_graft_resume_safety.bats, and
        # test_verify.bats (42 of the 43 — the last one is the git finding
        # below) — NOT the "12 tests in 3 files" this issue's own report
        # named, an earlier measurement against a smaller slice of this
        # suite (more captured-PHP tests have landed since, in #83/#107/
        # #111). php-cli alone is not enough: lib/php/wxr-content-
        # functions.php's XMLReader-based parser (chosen over DOMDocument
        # specifically to bound memory on large WXR exports — see that
        # file's own header) needs the `dom`/`xml` extension, which
        # Debian/Ubuntu ships as the separate `php-xml` package, not
        # bundled into `php-cli`. With both packages installed, the same
        # bare-container run is clean at 1068/1068, also reproduced twice.
        #
        # git (issue #106 sweep): tests/lint/no-fatal-parameter-expansion.sh
        # prefers `git ls-files` (respects .gitignore) over a find-based
        # fallback, and one of its own tests
        # ("guard sees a brand-new file that has not been git added yet",
        # test_no_fatal_parameter_expansion.bats) exercises that git path
        # directly, with no guard of its own — same undeclared-by-luck
        # shape as php: ubuntu-latest ships git (actions/checkout needs
        # it), a bare image does not. That test is the 43rd failure above,
        # and is fixed by the same measured re-run.
        run: sudo apt-get update && sudo apt-get install -y bats jq rsync perl openssh-client curl git php-cli php-xml

      - name: bats tests/unit/
        # Canonical run command per CLAUDE.md. Integration tests
        # (tests/integration/ddev-harness.sh) are intentionally NOT run
        # here — they need a real DDEV/Docker harness with two live WP
        # sites, which this runner doesn't have.
        run: bats tests/unit/

  php-lint:
    name: PHP lint (php -l)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install php-cli
        run: sudo apt-get update && sudo apt-get install -y php-cli

      - name: php -l on every .php file
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  stdin-hang-guard:
    name: Stdin-hang guard (issue #102)
    runs-on: ubuntu-latest
    # 20 min: measured normal (non-hanging) full runs are ~2-3 minutes
    # under this exact harness (see the script's own header). The per-test
    # cap is 120s (also justified there, from a full-suite measurement,
    # not a partial sample) -- so this ceiling has room for roughly 8-10
    # SIMULTANEOUS test-level hangs before the JOB timeout races ahead of
    # the guard's own per-test one. That is not a promise every hang gets
    # individually named and reported: past that count, GitHub kills the
    # job and whatever TAP output made it out names only the first
    # culprits, not all of them. Accepted degradation, not a guarantee --
    # a real regression is very unlikely to hang double-digit tests at
    # once (the four historical occurrences each hung exactly one), and
    # the job still goes red either way.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Same runtime dependencies as the unit-tests job -- this runs the
      # identical tests/unit/ suite, just under a stdin that never reaches
      # EOF instead of ubuntu-latest's default /dev/null. See that job's
      # own comment for why each package is here (issue #106: git,
      # php-cli, php-xml).
      - name: Install bats and sitegraft's runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq rsync perl openssh-client curl git php-cli php-xml

      - name: tests/lint/no-blocking-stdin-reads.sh
        # CI's stdin is already /dev/null, which is exactly why this repo
        # has shipped this bug class four times: a bare `read`/`cat` hits
        # instant EOF there and reads as "declined correctly." This job
        # runs the same suite under a stdin that stays open and never
        # delivers EOF instead, so a blocking read has something to block
        # on. See the script's own header for the full reasoning -- and
        # its SCOPE section for what this job structurally cannot catch: a
        # test that supplies its own stdin (as most confirmation-prompt
        # tests correctly do) is immunized from this dynamic guard by
        # construction. lib/plan.sh's three confirmation helpers were a
        # live example of that gap (issue #103, fixed).
        run: tests/lint/no-blocking-stdin-reads.sh
